mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

marked.setOptions({
  breaks: true,
  gfm: true
});

let currentIndex = -1;
let filteredTopics = [];

function displayName(filename) {
  return filename.replace('.md','').replace(/[-_]/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

function renderSidebar(topics) {
  const sidebar = document.getElementById('sidebar');
  filteredTopics = topics;
  
  if (topics.length === 0) {
    sidebar.innerHTML = '<div class="no-results">No topics match your search.</div>';
    document.getElementById('search-count').textContent = '0 found';
    return;
  }
  
  document.getElementById('search-count').textContent = topics.length + ' found';
  
  const html = topics.map((topic, idx) => {
    const star = topic.count >= 3 ? '<span class="badge-star" title="Appears in 3+ files">&#9733;</span>' : '';
    const fileWord = topic.count === 1 ? 'file' : 'files';
    return `<div class="topic-item" role="option" data-idx="${idx}" onclick="selectTopic(${idx})" tabindex="-1">
      <span class="topic-name">${escapeHtml(topic.name)}</span>
      <div class="topic-meta">
        <span class="badge-count">${topic.count} ${fileWord}</span>
        ${star}
      </div>
    </div>`;
  }).join('');
  
  sidebar.innerHTML = html;
  
  if (currentIndex >= 0 && currentIndex < topics.length) {
    const el = sidebar.querySelector(`[data-idx="${currentIndex}"]`);
    if (el) el.classList.add('active');
  }
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function selectTopic(idx) {
  currentIndex = idx;
  const topic = filteredTopics[idx];
  
  // Update sidebar active state
  document.querySelectorAll('.topic-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  
  // Scroll selected item into view
  const activeEl = document.querySelector('.topic-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  
  // Build content
  const inner = document.getElementById('content-inner');
  
  let html = `<h2 style="margin-bottom:20px;font-size:1.4rem;color:var(--text-primary)">${escapeHtml(topic.name)}</h2>`;
  
  topic.sources.forEach((src, srcIdx) => {
    html += `<div class="source-block">
      <div class="source-header">
        <span class="source-icon">&#128196;</span>
        <span class="source-filename">${escapeHtml(src.displayName)}</span>
      </div>
      <div class="md-content" id="md-${idx}-${srcIdx}"></div>
    </div>`;
    if (srcIdx < topic.sources.length - 1) {
      html += '<hr class="source-divider">';
    }
  });
  
  inner.innerHTML = html;
  document.getElementById('content').scrollTop = 0;
  
  // Render markdown for each source
  for (let srcIdx = 0; srcIdx < topic.sources.length; srcIdx++) {
    const src = topic.sources[srcIdx];
    const mdEl = document.getElementById(`md-${idx}-${srcIdx}`);
    if (!mdEl) continue;
    
    const mdText = src.heading + '\n\n' + src.content;
    mdEl.innerHTML = marked.parse(mdText);
    
    // Highlight code blocks
    mdEl.querySelectorAll('pre code').forEach(block => {
      hljs.highlightElement(block);
    });
  }
  
  // Render mermaid diagrams
  await mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
  
  // Fix mermaid pre blocks that weren't converted
  inner.querySelectorAll('code.language-mermaid').forEach(codeEl => {
    const pre = codeEl.closest('pre');
    if (pre) {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = codeEl.textContent;
      pre.replaceWith(div);
    }
  });
  
  // Re-run mermaid on any newly created nodes
  try {
    await mermaid.run({ nodes: document.querySelectorAll('.mermaid:not([data-processed])') });
  } catch(e) { /* ignore mermaid errors */ }
}

function filterTopics(query) {
  if (!query) {
    renderSidebar(TOPICS);
    return;
  }
  const q = query.toLowerCase();
  const filtered = TOPICS.filter(t => {
    if (t.name.toLowerCase().includes(q)) return true;
    if (t.sources.some(s => s.file.toLowerCase().includes(q))) return true;
    return false;
  });
  currentIndex = -1;
  renderSidebar(filtered);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  const search = document.getElementById('search');
  
  if (e.key === '/' && document.activeElement !== search) {
    e.preventDefault();
    search.focus();
    return;
  }
  
  if (e.key === 'Escape') {
    search.value = '';
    filterTopics('');
    search.blur();
    return;
  }
  
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = Math.min(currentIndex + 1, filteredTopics.length - 1);
    if (next !== currentIndex) selectTopic(next);
    return;
  }
  
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(currentIndex - 1, 0);
    if (prev !== currentIndex) selectTopic(prev);
    return;
  }
  
  if (e.key === 'Enter' && document.activeElement === search) {
    if (filteredTopics.length > 0) {
      selectTopic(0);
      search.blur();
    }
    return;
  }
});

document.getElementById('search').addEventListener('input', (e) => {
  filterTopics(e.target.value.trim());
});

// Initial render
renderSidebar(TOPICS);
document.getElementById('stat-topics').textContent = TOPICS.length;
document.getElementById('stat-cross').textContent = TOPICS.filter(t => t.count >= 3).length;
</script>
