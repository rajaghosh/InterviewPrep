      heading: `## Evaluation Metrics for LLMs`,
      content: `
### Overview

Building an AI application is straightforward; ensuring it performs reliably in production is the hard part. LLM evaluation requires systematic measurement across six dimensions: faithfulness, hallucination rate, answer relevance, correctness, coherence, and toxicity. Each metric is measured through a different workflow, typically using another LLM as the judge (LLM-as-Judge pattern) or comparing against ground truth labels. Skipping evaluation is the single most common reason AI systems fail silently in production.

### Evaluation Framework

| Metric | Definition | Workflow | How Measured |
|---|---|---|---|
| **Faithfulness** | Output is factually consistent with the provided context/instructions | Input → LLM → Output → Check vs Context | Faithfulness Score (0–1), Supported Statements % |
| **Hallucination Rate** | Proportion of response not supported by retrievable facts | Input → LLM → Output → Detect unsupported claims | Hallucination Rate (%), % Unsupported Statements |
| **Answer Relevance** | How relevant is the response to the original question | Question → LLM → Relevance Check | Relevance Score (0–1), Human/LLM Judge Score |
| **Correctness** | Factually accurate compared to ground truth | Question → LLM → Compare with Ground Truth | Accuracy (%), EM, F1, ROUGE, BLEU |
| **Coherence & Fluency** | Language quality and readability | LLM Output → Evaluate Language Quality | Fluency Score (1–5), Perplexity Score |
| **Toxicity & Safety** | Contains harmful or unsafe content | LLM Output → Safety Check | Toxicity Score (0–1), % Flagged Responses |

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    Input["User Input\\n+ Context"]
    LLM["LLM Engine"]
    Output["Model Output"]

    subgraph EvalLayer ["Evaluation Layer"]
        Faith["Faithfulness\\nCheck"]
        Hall["Hallucination\\nDetector"]
        Rel["Relevance\\nScorer"]
        Safe["Safety\\nFilter"]
    end`
    }

      heading: `## File Compression Fundamentals`,
      content: `
### Overview

A classic technical interview question: "How can a 10GB file be compressed to 3GB?" The answer requires understanding lossless compression algorithms, specifically **DEFLATE** (used by ZIP, gzip), which combines LZ77 (dictionary-based deduplication) and Huffman coding (variable-length encoding).

**Source:** "The 10GB to 3GB File Compression Question" (interview prep post)

**Interview One-Liner:** "Compression reduces file size by removing redundancy and storing repeated patterns efficiently — without losing any data."

### How Compression Works

1. **Scan** the file for repeated byte sequences (LZ77 dictionary)
2. **Replace** repeated sequences with shorter references (back-references)
3. **Encode** the result with Huffman coding (frequent bytes = short codes)
4. **Store** the compressed bitstream + decompression dictionary

**Crucial Note:** This is **lossless** — the original 10GB file is perfectly reconstructed on decompression.

### Compression Efficiency by File Type

| File Type | Typical Compression Ratio | Why |
|---|---|---|
| Plain text (.txt, .csv) | 60–80% size reduction | High repetition of words and patterns |
| Source code (.py, .js) | 50–70% reduction | Repeated keywords, whitespace |
| Office docs (.docx, .xlsx) | 40–60% reduction | XML structure with repetition |
| JPEG images | ~0% reduction | Already compressed (lossy) |
| MP4 video | ~5% reduction | Already compressed (lossy) |
| Already-zipped files | ~0% reduction | Entropy already maximized |

### Interview Q&A`

      content: `
**Video:** *File deletion explained* by this.tech.girl

### How File Deletion Works

\`\`\`
File system stores:
 ├── Inode (metadata: permissions, timestamps, pointer to data blocks)
 └── Directory entry (filename → inode number)

On deletion:
 1. Directory entry is removed (filename unlinked)
 2. Inode reference count decremented
 3. If ref count = 0 → data blocks marked "free" (NOT zeroed)
 4. Data physically remains until overwritten
\`\`\`

### Key Concepts

| Concept | Explanation |
|---|---|
| **Soft delete** | Mark record as deleted in DB (is_deleted=true); data retained |
| **Hard delete** | Remove inode reference; data recoverable until overwritten |
| **Secure delete** | Overwrite data blocks with random bytes before unlinking |
| **Copy-on-Write (CoW)** | ZFS/Btrfs never overwrite; write new blocks, then update pointer |

**6. "Silent Gap" Failure in Task Decomposition**

If the coordinator decomposes "creative industries" into only three visual arts sub-niches, the subagents perform perfectly — but music, writing, and film are never covered. The failure is invisible. Root cause: the coordinator's initial planning phase was too narrow. Fix: coordinator must explicitly enumerate all domains before delegating.

### Interview Q&A

| Question | Answer |
|---|---|
| Why must the coordinator partition work before parallel delegation? | Parallel agents are blind to each other — without partitioning they redundantly process the same topics, doubling token costs and producing duplicate synthesis input. |
| What should a subagent return on error? | Structured error context: failure type, the attempted query, any partial results obtained, and suggested alternative approaches — giving the coordinator enough information to make an informed recovery decision. |
| What is the "Lost in the Middle" effect in multi-agent synthesis? | When upstream agents return full verbose content (155K tokens), the synthesis agent's attention degrades for information in the middle of the input. Fix: upstream agents return structured key facts, not raw content. |
| Why should agents route through the coordinator rather than communicate directly? | The coordinator maintains global state and provides observability. Direct agent-to-agent communication creates a black box, making debugging and error handling much harder. |
| What is a "silent gap" failure in coordinator-subagent decomposition? | The coordinator decomposes a broad topic into a subset of its domains, subagents execute perfectly within those narrow scopes, but whole categories of the topic are never covered — and the pipeline succeeds with a fundamentally incomplete result. |

**Fine-tuning** is the process of taking a pre-trained LLM (which has learned general language understanding from massive data) and continuing its training on a **smaller, domain-specific dataset** to adapt it for a particular task or style. Unlike prompting (which influences output at inference time) or RAG (which injects external knowledge), fine-tuning permanently modifies the model's weights — embedding domain knowledge, tone, and task-specific patterns directly into the model. Fine-tuning is expensive (requires GPU compute and labelled data) but produces superior task performance when the target domain differs significantly from the pre-training distribution.

### Overview

The most common architectural mistake in enterprise AI is using fine-tuning to "teach" an LLM factual data. Fine-tuning adjusts model weights — it encodes style, behavior, and formatting patterns, not live facts. Factual data injected via fine-tuning suffers from the Stale-Weight Vulnerability: once business data changes, the model's embedded "knowledge" is wrong, and fixing it requires a full, expensive retraining cycle. RAG, by contrast, treats the model as a processor and the database as the source of truth — allowing instant updates via standard database operations.

> **Key insight from the video:** *"You just spent $50,000 fine-tuning an LLM on your company data, and it still hallucinated during a live demo. You tried to use a neural network as a hard drive."*

**Source Post:** _howitworks · System Design Series #13  
**On-Screen Title:** System Design #13: Proxies  
**Caption:** Proxies sit between clients and servers. Forward proxies hide clients. Reverse proxies hide servers. CDNs and load balancers are common examples of reverse proxies, helping systems scale, stay available, and perform better.

### Overview

A proxy is an intermediary server that sits between two parties in a network communication, forwarding requests and responses on their behalf. The critical distinction lies in *who is being hidden*: a forward proxy hides the client from the server (the server sees the proxy's IP, not the client's), while a reverse proxy hides the server pool from the client (the client sees one endpoint, unaware of the N backends behind it). CDNs, load balancers, and API gateways are all reverse proxy implementations. Forward proxies are common in corporate networks for access control, URL filtering, and traffic anonymization. Understanding this distinction is foundational to network security, traffic management, and distributed system design at scale.

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    subgraph fpGroup["Forward Proxy — Hides the Client"]
        clientA["Client\\n(Private IP Hidden)"]
        fproxy["Forward Proxy\\n(Masks Client IP)"]
        internet["Internet / Server\\n(Sees Proxy IP only)"]
        clientA -->|request| fproxy
        fproxy -->|forwarded with proxy IP| internet
        internet -->|response| fproxy
        fproxy -->|response| clientA

        rproxy["Reverse Proxy\\n(Load Balancer / CDN)"]
        srv1["App Server 1"]
        srv2["App Server 2"]
        srv3["App Server 3"]
        clientB -->|request| rproxy`

      heading: `## Frontend Network Optimization`,
      content: `
### Overview

Frontend system design is a discipline focused on minimizing the network surface between browser and server. Optimizations span payload compression, resource loading strategies, caching, and connection multiplexing. A well-optimized frontend can cut load time from 5s to <1s without changing backend logic.

### Key Techniques

| Technique | Mechanism | Impact |
|---|---|---|
| **Gzip/Brotli Compression** | Compress HTTP responses before transmission | 60–80% payload reduction |
| **Lazy Loading** | Load images/components only when in viewport | Reduces initial bundle size |
| **Code Splitting** | Break JS bundle into per-route chunks | Faster Time-to-Interactive |
| **HTTP/2 Multiplexing** | Multiple requests on one TCP connection | Eliminates head-of-line blocking |
| **Prefetching** | Predict next page and prefetch in background | Instant navigation for predicted flows |
| **Service Worker Cache** | Cache API responses + assets locally | Works offline; near-zero latency for repeats |
| **GraphQL field selection** | Request only needed fields | Prevents over-fetching |
| **CDN for Static Assets** | Serve from edge node nearest the user | <10ms for cached assets |

### Interview Q&A

| Question | Answer |
|---|---|
| What is the Critical Rendering Path? | The sequence of steps a browser takes to render a page: HTML parse → DOM → CSSOM → Render Tree → Layout → Paint. Blocking resources (sync scripts, large CSS) delay this path. |
| What is the difference between lazy loading and prefetching? | Lazy loading defers loading until needed. Prefetching proactively loads future resources before the user requests them. Both reduce perceived latency for different scenarios. |

---

Generative AI produces new content (text, images, code, audio) by learning the statistical patterns in training data and generating novel outputs that follow those patterns. The core pipeline has five iterative stages.

### The 5-Stage GenAI Pipeline

1. **Data Pre-processing** — clean, tokenize, normalize raw training data; filter low-quality content

3. **Identifying Patterns** — model learns latent representations: grammar, facts, reasoning, style

### Overview

Git 2.23 (2019) introduced \`git switch\` and \`git restore\` to decompose the overloaded \`git checkout\` command into two focused, safer operations. \`git checkout\` was responsible for two unrelated tasks: changing the active branch AND discarding working directory changes — a dangerous combination where a typo could silently overwrite local modifications. \`git switch\` handles branch operations exclusively; \`git restore\` handles file restoration exclusively. This makes intent unambiguous and eliminates accidental data-loss bugs from the legacy command's dual behavior.

        CO --> CORESTORE
    end

    subgraph MODERN["Modern — Decomposed Commands"]
        SW["git switch\\nBranch operations only"]
        RS["git restore\\nFile restoration only"]
        SWEX["git switch feature\\ngit switch -c new-branch"]
        RSEX["git restore file.txt\\ngit restore --staged file.txt"]
        SW --> SWEX
        RS --> RSEX

      heading: `## HashSet vs TreeSet — Java Collections`,
      content: `
### Overview

HashSet and TreeSet both implement the \`Set\` interface — uniqueness guaranteed — but make fundamentally different trade-offs between speed and order. The choice directly impacts algorithmic complexity for insert, delete, and lookup operations.

### Comparison Table

| Property | HashSet | TreeSet |
|---|---|---|
| **Underlying structure** | HashMap (hash table) | Red-Black Tree |
| **Insert / Delete / Lookup** | O(1) average | O(log N) |
| **Order** | No guaranteed order | Sorted (natural or Comparator) |
| **Null values** | 1 null allowed | No null (null breaks comparison) |
| **Thread safety** | Not thread-safe | Not thread-safe |
| **Memory** | More (hash table overhead) | Less (tree nodes) |
| **Use case** | Fast deduplication, membership checks | Sorted unique values, range queries |

### Decision Flowchart

\`\`\`mermaid
flowchart TD
    Problem["Need a Set?"]
    OrderNeeded{"Order / Range\\nQuery needed?"}
    UseTree["Use TreeSet\\nO(log N) ops\\nSorted output"]
    UseHash["Use HashSet\\nO(1) ops\\nFaster for lookup"]

    Problem --> OrderNeeded
    OrderNeeded -->|"Yes"| UseTree
    OrderNeeded -->|"No"| UseHash
`

      heading: `## Horizontal AI vs Vertical AI`,
      content: `
### Overview

Horizontal AI refers to general-purpose models (LLMs, vision models) that work across many industries. Vertical AI refers to domain-specific models trained or fine-tuned for a narrow use case (medical diagnosis, legal contract review, financial forecasting). In practice, most production AI is a hybrid: a horizontal foundation model + vertical fine-tuning or RAG.

### Comparison

| Dimension | Horizontal AI | Vertical AI |
|---|---|---|
| Scope | General — any task, any industry | Narrow — one domain or task |
| Examples | GPT-4, Claude, Gemini | PathAI (pathology), Harvey (legal), BloombergGPT (finance) |
| Training | Pre-trained on diverse web data | Fine-tuned or trained on domain corpus |
| Performance | Good general, weaker on specialized | Superior on domain tasks |
| Cost | Available via API | Expensive to train and maintain |
| Compliance | May not meet regulatory requirements | Can be designed for HIPAA, SOC2, FINRA |

### Interview Q&A

| Question | Answer |
|---|---|
| Is the horizontal/vertical distinction always clear? | No. Most modern "vertical AI" is actually a horizontal LLM with RAG + fine-tuning + prompt engineering. Pure vertical models (trained from scratch on domain data) are rare due to cost. |

---

      displayName: `Failover Hpack Systemdesign Multitopic Jul09`,
      heading: `## HPACK — HTTP/2 Header Compression`,
      content: `
### Overview

HPACK is the header compression algorithm mandated by HTTP/2 (RFC 7541). It addresses a critical performance problem in HTTP/1.1: headers like \`User-Agent\`, \`Cookie\`, \`Authorization\`, and \`Accept\` are sent as plaintext strings on every single request, even when they are identical across requests. HPACK eliminates this redundancy using two tables — a **static table** (61 predefined common header entries) and a **dynamic table** (per-connection table of recently sent headers) — plus optional **Huffman encoding** for literal values. Instead of resending a full header, the client sends a tiny integer index reference. This dramatically reduces per-request overhead, particularly for mobile clients with many small API calls.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant C as Client
    participant S as Server

    Note over C,S: HTTP/1.1 — No Compression (Repeated Overhead)
    C->>S: GET /index.html\\nUser-Agent: Mozilla/5.0...\\nCookie: session_id=123...\\nAccept: text/html\\nAuthorization: Bearer eyJhbG...
    C->>S: GET /style.css\\nUser-Agent: Mozilla/5.0...\\nCookie: session_id=123...\\nAccept: text/html\\nAuthorization: Bearer eyJhbG... (SAME AGAIN)

    Note over C,S: HTTP/2 with HPACK — Indexed References
    C->>S: Request 1: Full headers → indexed into Dynamic Table
    S-->>C: ACK + server headers → also indexed
    C->>S: Request 2: Only index numbers (e.g., :2, :4, :62)\\nSaves ~400 bytes per request
\`\`\`

### How It Works

1. **Static Table**: Both client and server share a pre-agreed table of 61 common headers (e.g., index 1 = \`:authority\`, index 2 = \`GET\`, index 62 = \`user-agent\`).
2. **First request**: New headers not in static table are sent as literals and added to the **dynamic table** with a newly assigned index.
3. **Subsequent requests**: Matching headers are replaced with their integer index — a 1-2 byte integer instead of a 30–100 byte string.
4. **Huffman encoding**: For values that must be sent literally, Huffman coding compresses the byte representation by ~30%.
5. **Dynamic table eviction**: Oldest entries are evicted when the table reaches its size limit (negotiated via \`SETTINGS_HEADER_TABLE_SIZE\`).
6. **Server push headers**: The same compression applies to server-initiated pushes.`
    }
    ]

The HTTP \`QUERY\` method is a new standard proposed after 16+ years of workarounds, designed to handle **complex, read-only search requests with a request body**. The long-standing problem: \`GET\` cannot carry a request body (HTTP spec violation in practice), so developers have misused \`POST\` for read-only search — which is semantically wrong (\`POST\` implies resource creation). \`QUERY\` provides a clean, standards-compliant way to send structured search criteria in a body while remaining idempotent and safe (read-only). Expected adoption in REST APIs, GraphQL-style endpoints, and API gateways.

      heading: `## HyperLogLog — Probabilistic Cardinality Estimation`,
      content: `
### Overview

HyperLogLog (HLL) is a probabilistic algorithm for estimating the cardinality (count of distinct elements) of a dataset using a fraction of the memory that exact counting would require. Instead of storing every unique element in a set, HLL exploits the statistical distribution of leading zeros in hashed bit sequences to derive an approximate count. The trade-off is a configurable margin of error (~1–2%) in exchange for constant, extremely low memory usage (~12 KB) regardless of dataset size. This makes HLL the go-to solution for cardinality estimation at scale in analytics, streaming pipelines, and distributed systems.

> **Source:** Packetory (Reel #225) — "How Probabilistic Data Structures: HyperLogLog works"

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    input["Incoming Data Stream\\n(billions of items)"] --> hashFn["Hash Function\\n(uniform bit distribution)"]
    hashFn --> split["Split Hash\\nFirst p bits → Bucket ID\\nRemaining bits → Leading Zero Count"]
    split --> buckets["m Registers / Buckets\\n(each tracks max leading zeros)"]
    buckets --> harmonic["Harmonic Mean\\nof all bucket max-values"]
    harmonic --> bias["Apply Bias Correction\\nconstant α × m²"]
    bias --> estimate["Cardinality Estimate\\n~1–2% error"]

Idempotency is a critical system design property: an idempotent operation produces the same result whether executed once or many times. In distributed systems, network failures and retries make idempotency essential — especially for payment processing, order placement, and API mutations. Implementing idempotency requires assigning a unique idempotency key per request and persisting the result so repeat requests return the cached outcome rather than re-executing.

    CheckProcessed -->|"No (first request)"| ProcessPayment --> Success

### Overview

**Post/Video Name:** "Understanding Idempotency in System Design"

**Definition:** "Doing the same thing multiple times gives the same result."

Idempotency is a critical property in distributed systems where network failures cause requests to be retried. Without idempotency, retries cause duplicate charges, double-sent emails, or duplicate database records. Idempotency is achieved by associating a unique **Idempotency Key** with each mutating request.

### Idempotency Key Flow

\`\`\`mermaid
flowchart LR
    subgraph Client ["Client"]
        A["Client sends request\\n+ Idempotency Key\\n(UUID v4)"]
    end

    subgraph Server ["Server"]

        C["Process Request\\nStore Result + Key"]
        D["Return Stored\\nResult (no re-process)"]
    end

    subgraph Store ["Idempotency Store (Redis)"]
        E["Key → Result\\n(TTL: 24h)"]
    end

    A --> B
    B -->|"New Key"| C
    B -->|"Existing Key"| D`

      content: `
### Overview

Database indexing is one of the most commonly misapplied performance optimizations. The instinct when reads are slow is to "add an index" — but in **write-heavy systems** this is often counterproductive. Every index maintained on a table must be updated on every INSERT, UPDATE, and DELETE, adding B-tree rebalancing overhead to every write operation. In high-frequency write workloads (e.g., GPS tracking where location is updated every second), adding indexes can make writes catastrophically slower, overwhelming the small read improvement gained. This is a classic High-Level Design interview trap.

### The Indexing Trap — Architecture Diagram

flowchart TD

    WriteHeavy["Write-Heavy System\\n(GPS tracking,\\nlog ingestion,\\nreal-time events)"]
    IndexHelps["Index Helps ✅\\nFaster lookups\\nAcceptable write overhead"]
    IndexHurts["Index Hurts ❌\\nB-tree updated per write\\nWrite throughput collapses"]
    Alternatives["Alternatives for Write-Heavy:\\n• Partition by time range\\n• Write-optimized DB (Cassandra)\\n• Async materialized views\\n• Read replica with index"]

    SlowRead --> Reflex --> Decision
    Decision -->|"Read-Heavy"| ReadHeavy --> IndexHelps
    Decision -->|"Write-Heavy"| WriteHeavy --> IndexHurts --> Alternatives

### Overview

Integration testing occupies the critical middle layer between unit tests (which verify a single module in isolation using mocks) and system tests (which validate the entire application end-to-end). Its purpose is to verify that two or more modules communicate correctly across their shared interface — catching bugs that only emerge from real interaction, such as serialization mismatches, incorrect API contracts, database schema drifts, or event format incompatibilities. The classic visual metaphor is two overlapping circles — each verified internally, but the overlap (the integration point) requires a separate test phase. Integration tests should run against real dependencies (real databases, real queues) in an isolated environment, not mocked implementations.

      file: `AI-SystemDesign-DSA-Multi-Topic-Jul06.md`,
      displayName: `Ai Systemdesign Dsa Multi Topic Jul06`,
      heading: `## Is NGINX a Zero-Copy Server?`,
      content: `
**Video:** *IS NGINX A ZERO-COPY SERVER !???*

### The Traditional I/O Problem (4 Copies)

\`\`\`
Disk
 └─[DMA copy]──► Kernel Buffer
                  └─[CPU copy]──► Application Buffer (user space)
                                   └─[CPU copy]──► Socket Buffer
                                                    └─[DMA copy]──► NIC
\`\`\`
**Result:** 4 data copies, 2 CPU copies → high overhead for file serving

### Zero-Copy Solution: sendfile()

\`\`\`
Disk
 └─[DMA copy]──► Kernel Buffer
                  └─[DMA copy]──► NIC   (bypasses application entirely)
\`\`\`
**Result:** 2 DMA copies, 0 CPU copies → ~3× faster for static file serving

### Is NGINX Zero-Copy?

**Yes, when serving static files.** NGINX uses the \`sendfile()\` syscall on Linux for static content delivery. However, for dynamic content (proxying to upstream, compression, SSL termination), NGINX processes data in user space — making it non-zero-copy for those paths.

\`\`\`nginx
# nginx.conf — enables zero-copy for static files
sendfile on;`
    }
    ]

JWT and OAuth 2.0 are not alternatives — they solve different problems at different layers of the auth stack. OAuth 2.0 is a delegation framework governing how tokens are issued, how users grant permission, and how clients access resources. JWT is a token format — a self-contained, cryptographically signed payload carrying claims (userId, roles, expiration). Production systems handling millions of users layer the two together: OAuth 2.0 manages consent and token issuance, JWT serves as the lightweight stateless access token passed across internal microservices, and OIDC (OpenID Connect) extends OAuth 2.0 to handle identity (authentication), not just authorization. A key comment from the reel's community correctly highlights that OAuth 2.0 alone is authorization — OIDC is what adds authentication.

    AC --> RT["Refresh Token\\n(long-lived, opaque, HttpOnly cookie)"]

    AT --> GW["API Gateway\\n(Validate JWT via JWKS)"]
    GW --> SVC1["Microservice A\\n(Validate JWT locally)"]
    GW --> SVC2["Microservice B\\n(Validate JWT locally)"]

    RT --> REFRESH["Refresh Endpoint\\n(Issue new Access Token)"]

    SVC2 --> DB

      heading: `## JWT Logout Strategies — Logout All Devices`,
      content: `
### Overview

JSON Web Tokens (JWTs) are **inherently stateless** — they reside on the client side and contain all session information, making them difficult to revoke once issued. This creates a fundamental challenge: when a user clicks "Logout All Devices," the server has no native way to invalidate tokens that are still cryptographically valid. Two primary server-side strategies solve this problem, each with different performance and complexity trade-offs.

**Source:** Chezile • Beanie (shared by morethancodebase) | Hashtags: \`#systemdesign #jwt #backend #authentication #security\`

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    userLogin["User Login\\n(any device)"]
    issueAT["Issue Access Token\\n(short-lived, e.g. 15min)"]
    issueRT["Issue Refresh Token\\n(long-lived, e.g. 7 days)"]
    storeRT["Store Refresh Token\\nin DB / Redis"]
    logoutAll["User clicks\\nLogout All Devices"]

    subgraph strategy1 ["Strategy 1 — Refresh Token Revocation"]
        revokeRT["Revoke all Refresh Tokens\\nfor this user_id"]
        rejectNew["New access tokens\\ncannot be issued"]
        waitExpiry["Existing ATs valid\\nuntil natural expiry"]
    end

    subgraph strategy2 ["Strategy 2 — Token Versioning"]
        bumpVer["Increment token_version\\nin DB for user"]
        checkVer["On every request:\\ncheck token_version\\nvs DB"]

### Overview

JSON Web Tokens (JWTs) are self-contained, cryptographically signed tokens widely used in modern authentication. The security of a JWT-based system depends not just on the token's signature algorithm but critically on where and how the token is stored client-side. A valid JWT in \`localStorage\` is a single XSS incident away from full account compromise. Industry best practice — validated by OWASP — is to store JWTs in \`HttpOnly\` cookies with full security flags, accepting the CSRF risk as a manageable problem with \`SameSite\` and CSRF tokens. The refresh token pattern further limits blast radius.

        setCookie["Set-Cookie: jwt=...\\nHttpOnly; Secure;\\nSameSite=Strict; Max-Age=900"]

        validate["Validate JWT signature\\nCheck expiry, issuer, audience"]

      heading: `## Kafka Exactly-Once Semantics`,
      content: `
### Overview

In distributed systems, message delivery has three levels: at-most-once (may lose), at-least-once (may duplicate), and exactly-once (processed exactly one time). Kafka achieves exactly-once via idempotent producers, transactional writes, and consumer offset management working together.

### Seven Strategies

| Strategy | Mechanism | Benefit |
|---|---|---|
| **Idempotent Producer** | Producer ID (PID) + sequence number | Broker deduplicates retried messages |
| **Kafka Transactions** | Atomic multi-partition commits | All-or-nothing writes across topics |
| **Read Committed Mode** | Consumer reads only committed data | Never processes aborted records |
| **Atomic Offset Commit** | Commit offset + process in one transaction | No duplicate processing on restart |
| **Outbox Pattern** | Write to outbox table + Kafka in one DB transaction | Guarantees DB and Kafka stay in sync |
| **Idempotent Consumer** | Consumer tracks processed IDs | Ignores duplicates at application layer |
| **Sagas** | Compensating transactions for rollback | Handles partial failures across services |

### Interview Q&A

| Question | Answer |
|---|---|
| What is the difference between idempotency at producer vs consumer level? | Producer idempotency means the broker deduplicates retried produce requests. Consumer idempotency means the application ignores already-processed messages (by tracking message IDs). Both are needed for true end-to-end exactly-once. |
| What is the Outbox Pattern? | Write to an outbox table in the same DB transaction as your business logic. A background process (Debezium CDC or a poller) reads the outbox and publishes to Kafka. Guarantees DB and event bus stay consistent without distributed transactions. |

---

# Part IV — AI/ML Engineering

---
`

      heading: `## Kafka Idempotent Producer — Exactly-Once Semantics`,
      content: `
### Overview

Kafka's Idempotent Producer guarantees exactly-once message delivery at the producer-to-broker level, solving the duplicate write problem caused by network partitions and retry logic. Without idempotency, a producer that retransmits a message (after failing to receive an ACK) can cause the broker to store it twice — leading to duplicate records downstream. The Idempotent Producer assigns each message a monotonically increasing **sequence number** per partition; the broker deduplicates by rejecting any message whose sequence number it has already committed, regardless of how many times the producer retransmits it.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant P as Idempotent Producer
    participant B as Kafka Broker Leader
    participant F as Follower Replica
    participant DB as Consumer DB

    P->>B: Msg Seq=101 (First Attempt)
    B->>F: Replicate Seq=101
    F-->>B: Replicated ACK
    Note over B: Crash Before ACK Sent!

    P->>B: Msg Seq=101 (Retry — same seq)
    B->>B: Check: Seq=101 already committed
    B-->>P: ACK (deduplicated — no duplicate write)

    B->>DB: Consumer reads Seq=101 (exactly once)
\`\`\`

### How It Works

1. Producer is initialized with \`enable.idempotence=true\`, which assigns it a **Producer ID (PID)** from the broker
2. Each message sent to a partition carries \`(PID, Partition, Sequence Number)\` — the sequence increments per partition`
    }

### Overview

Keyset and cursor pagination are scalable alternatives to \`LIMIT/OFFSET\`, which degrades with large datasets because \`OFFSET N\` requires scanning and discarding N rows before returning results. Keyset pagination uses raw column values of the last fetched row (e.g., \`WHERE id > 1000\`) directly in a \`WHERE\` clause, enabling index seeks instead of scans. Cursor pagination wraps those values in an opaque Base64-encoded string, hiding the underlying schema while providing the same seek-based performance. Both support only sequential (next/prev) navigation — not random page jumps.

      heading: `## KV Cache in LLMs`,
      content: `
### Overview

The **KV Cache** (Key-Value Cache) is the most important inference optimization in transformer-based LLMs. During autoregressive generation, every new token must attend to all previous tokens via self-attention — without caching, this means recomputing the Key (K) and Value (V) matrices for the entire prompt history on every step, making latency scale quadratically with sequence length (O(n²)). The KV cache stores these computed matrices so only the K and V vectors for the **new token** need to be computed each step, reducing per-step computation to O(n). The trade-off is GPU VRAM: KV cache for a 128K context window can consume tens of GBs, limiting batch concurrency.

### Architecture Diagram — Autoregressive Generation with KV Cache

\`\`\`mermaid
sequenceDiagram
    participant user as "User Prompt"
    participant attn as "Self-Attention Layer"
    participant cache as "KV Cache"
    participant output as "Next Token"

    user->>attn: Token 1 — compute K1, V1
    attn->>cache: Store K1, V1
    cache->>attn: Retrieve K1, V1
    attn->>output: Generate Token 2

    Note over attn,cache: Token N — only new K and V computed
    attn->>cache: Store K2, V2
    cache->>attn: Retrieve all past K, V
    attn->>output: Generate Token N+1
\`\`\`

### KV Cache Optimization Techniques

| Technique | Description | Benefit |
|---|---|---|
| Multi-Query Attention (MQA) | Share one K/V head across all query heads | Reduce KV cache size by num_heads factor |`

      content: `
### Overview

KV Cache (Key-Value Cache) is a critical inference optimization in Transformer-based LLMs. During token generation, the attention mechanism computes **Key** and **Value** matrices for every token in the context. Without caching, each new token generation requires recomputing these matrices for all previous tokens — an O(n²) cost. KV Cache stores these intermediate Key/Value states so they can be reused, reducing generation from quadratic to linear complexity per step. It is the primary reason modern LLMs can generate at practical speeds.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant U as User Prompt
    participant L as LLM Transformer
    participant KV as KV Cache
    participant O as Output Tokens

    U->>L: Input tokens [T1, T2, T3]
    L->>KV: Compute & store K/V for T1, T2, T3
    L->>O: Generate T4

    O->>L: Next step: generate T5
    L->>KV: Read cached K/V for T1-T4
    note over KV: Reuse — no recomputation
    L->>O: Generate T5 (faster)
\`\`\`

### How KV Cache Works

1. LLM generates text one token at a time using the attention mechanism.
2. Each token generation requires "attending" to every preceding token in the context.
3. Without cache: recompute Key/Value matrices for ALL prior tokens on each step → O(n) GPU ops per token × O(n) tokens = O(n²) total.
4. With KV Cache: store Key/Value matrices after first computation; retrieve on subsequent steps.`

In LLM inference, the model stores intermediate Key and Value (KV) tensor states for every token it processes in the current context window. As context windows grow (e.g., 128K tokens) and multi-user concurrency increases, KV cache consumes massive GPU VRAM — becoming the primary bottleneck for LLM throughput. **Lmcache** is a KV cache management library that offloads cache segments to secondary memory tiers (CPU RAM, NVMe SSD) when they are not immediately needed, then reloads them before the next forward pass — enabling larger effective context windows without requiring proportionally more GPU hardware.

      heading: `## Latency Metrics & CAP Theorem`,
      content: `
### Overview

Latency and the CAP theorem are two of the most fundamental concepts in distributed systems engineering. Latency is the observable end-user performance dimension; the CAP theorem defines the fundamental trade-off space that constrains every architectural decision in distributed data systems.

### Latency Defined

Latency measures the duration of time a single request takes to travel through your network architecture, process business logic, interact with data tiers, and return a response to the client device.

| Metric | Meaning |
|---|---|
| **p50 (median)** | 50% of requests complete faster than this value |
| **p95** | 95% of requests complete faster — signals tail latency issues |
| **p99** | 99% of requests complete faster — production SLA target |

**Architectural levers to minimize latency:** CDNs for geographic proximity, in-memory database caches (Redis), optimized database query indexes.

### CAP Theorem

The CAP theorem states that a distributed data system can simultaneously guarantee at most **two** of these three properties when a network partition event occurs:

| Property | Definition |
|---|---|
| **C — Consistency** | Every read receives the most recent write (no stale reads) |
| **A — Availability** | Every request receives a response (success or failure — not timeout) |
| **P — Partition Tolerance** | The system continues operating despite network partitions between nodes |

**The Core Trade-off:** In practice, P is non-negotiable (networks always fail) — so you choose between **CP** (consistent but may be unavailable during partitions) and **AP** (available but may serve stale data during partitions).

| Choice | Examples | Use When |`

When you call any LLM API (OpenAI, Anthropic, Gemini), your request travels through 14 infrastructure layers in approximately 400ms. The journey spans TLS termination, authentication, geographic routing, tokenization, model selection, and GPU-based inference. The inference engine alone accounts for 95% of total latency via the autoregressive decode loop — the fundamental reason token streaming exists. Understanding this pipeline is essential for optimizing TTFT, managing costs, and designing resilient AI-integrated systems.

      heading: `## LLM Context Window Limitations`,
      content: `
### Overview

The **context window** is the maximum number of tokens an LLM can process in a single prompt + response. While modern models support large context windows (128K–2M tokens), accuracy degrades as the window fills, and providers impose practical limits due to **GPU VRAM constraints**.

**Source:** [aiwith_rajnish — "Why is the Context Window Limited in LLMs? Part II"](https://www.instagram.com/p/DZAwAujvY9I/)

### Core Technical Constraints

| Constraint | Detail |
|---|---|
| **KV Cache Memory** | The attention mechanism stores Key-Value pairs for every token in the context. At 128K tokens, a single inference can require 50–100GB of VRAM. |
| **Quadratic Attention** | Standard attention scales O(n²) with sequence length. 2x context = 4x compute. Mitigated by Flash Attention, Sparse Attention. |
| **Accuracy Degradation** | Models exhibit "lost in the middle" effect — accuracy on tokens at the middle of a long context drops. Performance is best at start and end. |
| **API Cost** | Providers charge per input token. Large contexts = significant cost per call. Optimize with summarization and chunking. |

### Architecture Diagram — KV Cache Growth

\`\`\`mermaid
flowchart LR
    shortCtx["Short Context\\n(4K tokens)\\nKV Cache: ~2GB VRAM"]
    medCtx["Medium Context\\n(32K tokens)\\nKV Cache: ~16GB VRAM"]
    longCtx["Long Context\\n(128K tokens)\\nKV Cache: ~64GB VRAM"]
    vramLimit["GPU VRAM Limit\\n(A100 = 80GB)"]

    shortCtx --> medCtx --> longCtx
    longCtx -->|"Approaches limit"| vramLimit

      content: `
### LLM Statelessness (average.yash — Day 5)

**Critical insight: LLMs have no memory.** Each API call is completely independent.

\`\`\`python
# What actually happens in a "memory-aware" chatbot:
messages = [
    {"role": "user", "content": "My name is Raja"},
    {"role": "assistant", "content": "Hello Raja!"},
    {"role": "user", "content": "What's my name?"}  # ← dev passes full history
]
response = client.messages.create(model="claude-sonnet-4-6", messages=messages)
# The model "remembers" only because history is passed in each call
\`\`\`

The illusion of memory = developer manually appending conversation history to every request. The constraint is the **context window**.

### Token Economics (average.yash — Day 4)

**Every API request has 3 token types:**

| Token Type | Description | Cost Driver |
|---|---|---|
| **Input tokens** | The prompt you send | Length of your prompt |
| **Output tokens** | The model's response | Verbosity of answer |
| **Processing tokens** | Internal reasoning | Model's uncertainty / guessing |

**Key insight:** Short, vague prompts are NOT cheaper. They force the model to guess, increasing processing tokens and producing bloated output.
`

      heading: `## LLM Temperature`,
      content: `
### Overview

Temperature is a sampling parameter in LLMs that controls the trade-off between **accuracy/determinism** and **creativity/diversity** in generated outputs. It scales the logit distribution before sampling: low temperature sharpens the distribution (top token dominates), high temperature flattens it (more diverse tokens get sampled). Every production LLM call should set temperature deliberately based on the use case — the default varies by model.

### Temperature Spectrum

| Temperature | Behavior | Best Use Cases |
|---|---|---|
| 0.1 | Highly accurate, deterministic, predictable | Facts, logic, coding, structured data extraction |
| 0.1 – 0.3 | Precise, factual, consistent | Q&A, summaries, code, data extraction |
| 0.4 – 0.7 | Balanced creativity and accuracy | Blog writing, explanations, customer support |
| 0.8 – 1.0 | Creative, diverse, imaginative | Storytelling, brainstorming, poetry, marketing |
| 1.0 | Highly creative, diverse, unpredictable | Open-ended generation, ideation |

### Architectural Comparison

| Use Case | Recommended Temp | Why |
|---|---|---|
| SQL generation | 0.0 – 0.1 | Syntax errors are catastrophic; determinism critical |
| RAG answer generation | 0.1 – 0.3 | Stay grounded in retrieved context |
| Customer support chatbot | 0.3 – 0.5 | Friendly variation without hallucination risk |
| Code explanation | 0.2 – 0.4 | Accurate but readable |
| Creative writing | 0.8 – 1.0 | Novel, non-repetitive output desired |
| LLM-as-a-Judge | 0.0 | Deterministic evaluation required |

### Interview Q&A

| Question | Answer |
|---|---|`

      heading: `## LLM Token Economics & Optimization`,
      content: `
### Overview

LLMs charge based on tokens — not words, characters, or responses. Every API call is broken into subword units (tokens), and cost scales with total tokens consumed (input + output). Source: \`average.yash\`. When prompts are vague or ambiguous, the model performs more internal reasoning to interpret intent, consuming more processing cycles and output tokens. Token optimization is therefore both a cost-reduction strategy and a quality-improvement strategy: clearer prompts produce lower costs and better outputs simultaneously.

### Token Cost Principles

| Principle | Why It Matters |
|---|---|
| Tokens ≠ Words | A word can be 1-3+ tokens depending on subword tokenization |
| Input + Output | Both directions cost tokens — long context AND long outputs add up |
| Ambiguity costs | Vague prompts trigger more internal reasoning, more output tokens |
| System prompts recur | Every API call includes system prompt tokens — keep them concise |
| Context window is finite | Large contexts increase cost AND reduce model attention quality |

### Optimization Strategies

| Strategy | Implementation |
|---|---|
| Pre-tokenize with tiktoken | \`tiktoken.encoding_for_model("gpt-4").encode(text)\` — count tokens before sending |
| Use \`.env\` for API keys | \`python-dotenv\` — never hardcode keys in prompts or code |
| Prompt compression | Rewrite verbose prompts to convey same meaning in fewer tokens |
| Caching | Cache responses for identical or near-identical queries |
| Chunking | Split large documents into smaller chunks; retrieve only relevant chunks |
| Output length control | Specify \`max_tokens\` in API calls to cap output cost |

### Code Example

\`\`\`python
import tiktoken`

A load balancer is the traffic director of distributed systems. Its primary role is to intelligently distribute incoming requests across a pool of healthy servers, ensuring no single server becomes a bottleneck. The decision-making process follows a structured pipeline: health check filtering removes unhealthy servers, an algorithm selects the target server, and session management ensures stateful clients reconnect to the correct server. Modern load balancers operate at either Layer 4 (TCP/UDP — transport layer) or Layer 7 (HTTP/gRPC — application layer), with each offering different routing intelligence.

### Overview

\`localhost\` and \`127.0.0.1\` are often used interchangeably but differ architecturally. \`localhost\` is a hostname resolved via the system's hosts file (typically to \`127.0.0.1\` for IPv4 or \`::1\` for IPv6). \`127.0.0.1\` is a numeric IPv4 loopback address that bypasses DNS entirely.

### Comparison

| Feature | localhost | 127.0.0.1 |
|---|---|---|
| Type | Hostname | IPv4 loopback address |
| Resolution | Via \`/etc/hosts\` (can be overridden) | Direct — no DNS lookup |
| IPv6 | May resolve to \`::1\` | IPv4 only |
| Speed | Slightly slower (hosts file lookup) | Direct |
| Security | Hosts file can be hijacked (malware) | More deterministic |

### Interview Tips

- In containers (Docker), \`localhost\` inside the container refers to the container itself, not the host machine. Use \`host.docker.internal\` to reach the host.
- Some frameworks bind to \`localhost\` (IPv6 \`::1\`) by default in newer OS versions. If a service runs but you can't connect on \`127.0.0.1\`, check the binding address.

---

### Overview

Browser-side token storage is one of the most debated topics in web authentication security. The two dominant approaches — \`localStorage\` and HTTP cookies — differ fundamentally in their access model and attack surface. \`localStorage\` is accessible from any JavaScript running on the page, making it trivially readable by injected scripts (XSS). Cookies configured with \`HttpOnly\` are completely opaque to JavaScript, eliminating the most common token-theft vector. The industry consensus is clear: **never store JWTs or session tokens in \`localStorage\`**; always use \`HttpOnly\` cookies with \`Secure\` and \`SameSite\` flags set.

        end
        subgraph cookieStore ["Cookie Store"]
            httpOnlyCookie["HttpOnly Cookie\\ninvisible to JS"]
            regularCookie["Regular Cookie\\nvisible to JS"]
        end
    end

    subgraph Server ["Backend Server"]
        authServer["Auth / API Server"]
        sessionStore["Server-Side Session Store\\nRedis or DB"]
    end

### Overview

**LoRA (Low-Rank Adaptation)** is a parameter-efficient fine-tuning (PEFT) technique that freezes a pretrained model's weights and injects trainable low-rank matrices (ΔW = A×B) into each transformer layer. Instead of updating billions of parameters, only the small A and B matrices are trained — reducing GPU memory and training time by 10–100x. Multiple variants have emerged to address specific bottlenecks in the original approach.

### Architecture Diagram

\`\`\`mermaid
flowchart LR
    subgraph LoRAFlow ["LoRA Injection Mechanism"]
        W2["W\\n(frozen pretrained weights)"] --> Add["Output = W·x + ΔW·x\\n(scaled by alpha/r)"]
        A["Matrix A\\n(random init, shape d×r)"] --> AB["ΔW = A × B\\n(rank r << min d,k)"]
        B["Matrix B\\n(zero init, shape r×k)"] --> AB
        AB --> Add
    end

    subgraph Variants ["LoRA Variants"]
        G["GaLore\\nProject full gradients to\\nlow-rank space — saves optimizer mem"]
        V["VeRA\\nFrozen shared A,B across layers\\nLearn only scale vectors b,d"]
        D["Delta-LoRA\\nAlso adjust W += delta of AB\\nacross consecutive training steps"]
        L["LoRA+\\nHigher learning rate for B vs A\\nFaster, more optimal convergence"]
    end

### Overview

"Lost in the Middle" is a well-documented empirical failure mode in LLMs where recall accuracy follows a **U-shaped curve** relative to token position in a long prompt. Information placed at the **beginning** (primacy effect) and **end** (recency effect) of the context is recalled accurately, while information placed in the **middle** of a long prompt is statistically more likely to be ignored, forgotten, or misattributed. This has critical implications for RAG context assembly, long-document summarization, and agent memory design.

### Accuracy vs Position

\`\`\`mermaid
flowchart LR
    start["Beginning of Prompt\\n(High Accuracy)\\nPrimacy Effect"]
    middle["Middle of Prompt\\n(Low Accuracy)\\n⚠️ Lost Here"]
    endPos["End of Prompt\\n(High Accuracy)\\nRecency Effect"]

    start --> middle --> endPos

    classDef errorNode   fill:#E81123,stroke:#B30D1A,color:#fff

    class start,endPos outputNode
    class middle errorNode
\`\`\`

### Developer Mitigations

| Strategy | How It Helps |
|---|---|
| **Put critical context first** | Exploits the primacy effect; the model reliably processes the opening |
| **Put the question last** | Exploits the recency effect; the model focuses on the most recent instruction |
| **Reduce context length** | Fewer tokens in the middle = less information at risk |
| **Re-rank retrieved chunks** | Put highest-relevance chunks at start/end; avoid placing them in the middle |`

### Overview

System design interviews require a practitioner mindset: decompose any large system into core primitives, then layer scale, reliability, and consistency considerations on top. The \`@pluto.careers\` post highlighted the most common interview challenges and the mental model needed to approach each confidently.

### Featured System Design Challenges

| System | Core Primitives | Key Decisions |
|---|---|---|
| URL Shortener | Hash function, DB, redirect | Hash collision strategy, custom slugs, analytics |
| Rate Limiter | Sliding window, token bucket | Storage (Redis), distributed coordination |
| Chat Application | WebSockets, message queue, DB | Fan-out, delivery guarantees, offline storage |
| Notification System | Push service, event queue, retry | Deduplication, priority queues, DLQ |
| Search Autocomplete | Trie, inverted index, caching | Prefix matching, personalization, latency |
| Video Streaming | CDN, chunking, adaptive bitrate | ABR (HLS/DASH), encoding pipeline, cold content |
| Distributed Cache | Hash ring, eviction policy | Consistent hashing, replication factor, TTL |
| Payment System | Idempotency, transactions, audit | Exactly-once delivery, saga pattern, reconciliation |

### Learning Strategy for System Design

1. **Learn primitives, not systems** — Most "Design X" questions reduce to: load balancing + caching + queues + DB sharding
2. **Practice the RADIO framework** — Requirements → API design → Data model → Infrastructure → Deep dives
3. **Narrate trade-offs explicitly** — Interviewers care more about *why* you chose an approach than the approach itself
4. **Draw first, explain second** — Start with a 3-box diagram (client → server → DB), then evolve

> **Interview Note:** If a question seems daunting, break it down into core primitives. Most "Design X" systems are combinations of: consistent hashing + caching + message queues + distributed locking.

### Overview

Two foundational agentic AI protocols have emerged for connecting LLMs to tools and other agents: **MCP (Model Context Protocol)**, developed by Anthropic, and **A2A (Agent-to-Agent Protocol)**, developed by Google. MCP standardizes how a single LLM accesses tools and data sources (LLM-centric, hub-and-spoke). A2A standardizes how autonomous agents communicate with each other in a distributed network (agent-centric, peer-to-peer). These protocols are complementary: MCP for individual agent capability, A2A for multi-agent team coordination. The industry is shifting from "AI using tools" (MCP era) to "AI teams working together" (A2A era).

**On-Screen Prompt:** *"Scenario: Plan a trip to Bali and save it to my calendar."*  
**Key Insight:** The real power lies in combining both protocols — MCP for individual agent capabilities and A2A for team-level coordination. *(Community note: xdn12026)*

Memory management is a fundamental system design consideration that affects latency, throughput, and reliability at scale. Languages fall into two categories: **managed-memory** (Python, Java, Go, C#) where a garbage collector automatically handles allocation/deallocation, and **manual-memory** (C, C++, Rust) where developers explicitly control memory. The choice has profound implications for system architecture — managed-memory enables faster development with safety guarantees, while manual-memory delivers predictable sub-millisecond latency. For system design interviews, understanding this trade-off is essential when justifying technology stack decisions. Engineers must understand the underlying memory model when deciding which language or framework to choose based on performance and scalability requirements.

### Overview

Processing datasets larger than available RAM requires a fundamental shift from "load everything, process everything" to stream-based, chunked, and lazy evaluation patterns. Python's generator protocol maintains O(1) memory regardless of dataset size by computing values on demand. Pandas chunking processes data in fixed-size batches. Dask provides out-of-core processing where data lives on disk and only active chunks are in RAM. Dtype optimization alone can reduce memory footprint by 50–70%. The core interview insight: never upgrade hardware before upgrading your approach.

### Architecture Diagram

\`\`\`mermaid

    problem["OOM Error\\n10GB Dataset on 8GB RAM\\nScript crashes on load"] --> gen["Generators\\nyield keyword\\nO(1) memory regardless of size\\nOne item at a time"]

    problem --> dask["Dask / Polars\\nOut-of-core processing\\nData stays on disk\\nLazy evaluation graph"]

    problem --> inplace["Avoid Hidden Copies\\nIn-place operations\\nNo silent DataFrame clones\\nPrevent memory spikes"]
    gen --> solution["Process 10GB Successfully\\non 8GB RAM\\nConstant memory footprint"]
    chunk --> solution

    dask --> solution
    early --> solution
    inplace --> solution

      heading: `## Message Prefilling vs Forced Tool Calling`,
      content: `
### Overview

These are two complementary **API-level steering techniques** for controlling LLM output format — distinct from prompt engineering inside the chat interface. Both are used in agent systems where the developer needs reliable, structured output from the model without relying on the model's own judgment about format.

### Technique Comparison

| Dimension | Message Prefilling | Forced Tool Calling |
|---|---|---|
| **Mechanism** | Pre-populate the model's response buffer with specific tokens (e.g., \`{"tool": "calculate", "args":\`) | Constrain the model's output space via API parameter (\`tool_choice: "required"\`) |
| **How it works** | Forces the model to continue from a given prefix, dramatically biasing output format | The API layer only allows tool call outputs; free-form text is rejected |
| **Best use case** | Strict adherence to a specific output format or JSON schema | Ensuring a tool is always invoked regardless of the model's "opinion" |
| **Reliability** | High for format; model may produce invalid completions of prefix | Very high; the API enforces it structurally |
| **Flexibility** | Developer controls exact starting tokens | Limited to tool schemas defined in the request |

### Architecture Diagram

\`\`\`mermaid
flowchart LR
    dev["Developer"]

    subgraph prefill ["Message Prefilling"]
        pA["User message + assistant prefix\\n{\\"tool\\": \\"calc\\", \\"args\\":"]
        pB["LLM continues the JSON\\n(guaranteed prefix)"]
        pA --> pB
    end

    subgraph forced ["Forced Tool Calling"]
        fA["API call: tool_choice=required\\ntools=[calculate, search, ...]"]
        fB["API layer enforces\\ntool call output only"]`
    }
    ]

      heading: `## Microservice Transaction Failures — Saga Pattern`,
      content: `
### Overview

Distributed transactions across microservices cannot use traditional ACID transactions because each service owns its own database. If a multi-step operation (e.g., Reserve Inventory → Charge Payment → Confirm Order) partially fails, the system must roll back the completed steps through compensating transactions. The Saga pattern is the standard solution: it breaks the distributed transaction into a sequence of local transactions, each with a defined compensating action that undoes its effect on failure.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant orchestrator as Saga Orchestrator
    participant orderSvc as Order Service
    participant inventorySvc as Inventory Service
    participant paymentSvc as Payment Service

    orchestrator->>orderSvc: Create Order
    orderSvc-->>orchestrator: Order Created ✓
    orchestrator->>inventorySvc: Reserve Items
    inventorySvc-->>orchestrator: Items Reserved ✓
    orchestrator->>paymentSvc: Charge Payment
    paymentSvc-->>orchestrator: Payment FAILED ✗

    Note over orchestrator: Trigger Compensations (reverse order)
    orchestrator->>inventorySvc: Release Reserved Items
    inventorySvc-->>orchestrator: Released ✓
    orchestrator->>orderSvc: Cancel Order
    orderSvc-->>orchestrator: Cancelled ✓
\`\`\`

### Saga Variants

### Overview

A hidden cost of microservices architecture is the cumulative latency introduced by inter-service network calls. In a monolith, function calls between components take nanoseconds. In a microservice mesh, each service boundary adds a full network round-trip (typically 5–30 ms), plus JSON serialization/deserialization overhead, connection management, and TLS handshake cost. When a client request fans out to 3–5 downstream services in sequence or even in parallel, these costs stack up and significantly increase end-to-end response time. Additionally, a slow dependency (e.g., a promotional discount service running slowly) causes upstream services to block waiting for its response, eventually degrading the entire system.

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    ClientReq["Client Request"]
    GW["API Gateway"]
    US["User Service\\n(Network Call 1)"]
    OS["Order Service\\n(Network Call 2)"]
    Pay["Payment Service\\n(Network Call 3)"]
    DS["Discount Service\\n(SLOW — causes backup)"]
    CB["Circuit Breaker\\n(Fails Fast)"]
    Resp["Aggregated Response"]

    ClientReq --> GW
    GW --> US
    GW --> OS
    GW --> Pay
    OS --> DS
    DS -->|"Timeout"| CB
    CB -->|"Fallback Response"| OS
    US --> Resp
    OS --> Resp
    Pay --> Resp

      heading: `## Minimum Size Subarray Sum — Sliding Window (LC 209)`,
      content: `
### Overview

LeetCode 209 asks for the minimum length of a contiguous subarray whose sum is ≥ target. The optimal O(n) solution uses a two-pointer sliding window: the right pointer expands the window by adding elements, and the left pointer shrinks it whenever the sum constraint is satisfied. This works because all elements are positive — adding elements monotonically increases sum, removing them monotonically decreases it — making the two-pointer invariant valid. A O(n log n) binary search + prefix sum alternative exists but is rarely preferred in interviews.

### Algorithm Flowchart

\`\`\`mermaid
flowchart TD
    startNode["Input: nums array + target integer"] --> initNode["left = 0\\ncurSum = 0\\nminLen = infinity"]
    initNode --> rightLoop["Advance right pointer\\nthrough nums"]
    rightLoop --> addRight["curSum += nums[right]"]
    addRight --> whileCheck{"curSum >= target?"}
    whileCheck -->|"Yes"| updateLen["minLen = min(minLen, right - left + 1)"]
    updateLen --> shrinkLeft["curSum -= nums[left]\\nleft += 1"]
    shrinkLeft --> whileCheck
    whileCheck -->|"No"| moreElems{"More elements\\nto process?"}
    moreElems -->|"Yes"| rightLoop
    moreElems -->|"No"| finalCheck{"minLen == infinity?"}
    finalCheck -->|"Yes"| returnZero["return 0\\n(no valid subarray found)"]
    finalCheck -->|"No"| returnMin["return minLen"]

    classDef processNode fill:#FF8C00,stroke:#CC7000,color:#fff

    classDef outputNode  fill:#00B294,stroke:#007D68,color:#fff
    classDef errorNode   fill:#E81123,stroke:#B30D1A,color:#fff

    class startNode userNode
    class initNode,rightLoop,addRight processNode`

      content: `
### Overview

Model Context Protocol (MCP), introduced by Anthropic, is a standardized open protocol that enables LLMs to connect to external data sources and tools through a consistent client-server interface, eliminating the need for bespoke integrations per data source. MCP defines three server capability types: Tools (actions the model decides to call), Resources (data the app exposes for the model to read), and Prompts (pre-built templates surfaced to users). The transport layer is agnostic — MCP works over stdio (local subprocess), HTTP+SSE, or WebSocket — making it usable from local dev environments to cloud deployments. The protocol uses JSON-RPC 2.0 for all message exchange, with a well-defined lifecycle: Initialize → ListTools/Resources → Execute → Result. This standardization means a single Claude integration can talk to a local SQLite DB, a GitHub repo, a Slack workspace, or a Kubernetes cluster using the same MCP client.

### Architecture Diagram — MCP Components

\`\`\`mermaid
flowchart TD
    user["User"]
    hostApp["Host Application\\n(Claude Desktop / IDE / Agent)"]
    mcpClient["MCP Client\\n(JSON-RPC 2.0)"]
    transport["Transport Layer\\n(stdio / HTTP+SSE / WebSocket)"]

    subgraph mcpServer["MCP Server"]
        tools["Tools\\n(model-controlled actions)"]
        resources["Resources\\n(app-controlled data)"]
        prompts["Prompts\\n(user-controlled templates)"]
    end

    externalSystems["External Systems\\n(DB / API / File System / Git)"]

    user --> hostApp --> mcpClient --> transport --> mcpServer
    mcpServer --> externalSystems

**Multimodal RAG** addresses a critical limitation of traditional text-only RAG: when processing PDFs containing tables, images, and structured layouts, fixed-size chunking destroys the semantic relationships between elements. The solution is a **structure-aware pipeline** that applies layout analysis, OCR for scanned pages, and Vision Language Models (VLMs like GPT-4o or Claude) to generate text descriptions for images and charts before embedding. The resulting chunks carry rich metadata (page number, parent section ID, element type) enabling hierarchical retrieval — when a relevant table cell is retrieved, the system expands context to include its parent section, preserving full semantic relationships. This approach is the standard for enterprise document intelligence systems.

The N+1 query problem is a classic backend performance anti-pattern where an application fetches a list of N records and then issues an additional individual database query **for each record** — resulting in N+1 total queries instead of 1 or 2. ORM frameworks often cause this silently because the code looks clean in the abstraction layer while generating catastrophically inefficient SQL underneath. Great backend engineers always evaluate the actual queries generated, not just the application code.

        Q1 --> QN --> Bad

### Overview

When you scrub the Netflix timeline, preview thumbnails appear instantly — even though each one represents a distinct video frame from a potentially multi-hour stream. Fetching these as separate high-resolution image files would be catastrophically slow (hundreds of individual HTTP requests per scrub gesture). Instead, Netflix engineering uses **sprite sheets** — multiple preview frames packed into a single image grid — encoded in a binary container format called **.bif (Base Index Frame)**, pre-generated at 320p resolution and cached in the client's local device RAM before playback begins. Scrubbing then becomes a pure local memory operation with zero network latency.

    BIF["BIF Encoder\\n(.bif binary matrix)"]
    CDN["CDN Edge\\nCache"]
    ClientRAM["Client RAM\\nPre-load on Play"]
    Scrub["User Scrubs Timeline"]
    Preview["Instant Thumbnail\\n(Zero Network)"]

    VideoSrc --> FrameEx
    FrameEx --> Sprite
    Sprite --> BIF
    BIF --> CDN
    CDN -->|"Streamed at Playback Start"| ClientRAM
    Scrub --> ClientRAM
    ClientRAM --> Preview

      heading: `## Object.freeze() — True Immutability`,
      content: `
### Overview

\`Object.freeze()\` is the standard mechanism to achieve true (shallow) immutability for objects and arrays in JavaScript. When an object is frozen, its own enumerable properties cannot be added, removed, or modified — attempts will silently fail in non-strict mode or throw a \`TypeError\` in strict mode. Critically, \`Object.freeze()\` is *shallow*: it only freezes the top-level properties; nested objects remain mutable unless explicitly frozen. For deep immutability, a recursive freeze function is required. Combining \`const\` (prevents rebinding) with \`Object.freeze()\` (prevents mutation) gives the closest equivalent to a truly immutable variable.

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    freeze["Object.freeze(obj)"]
    shallowFrozen["Top-level properties\\nImmutable"]
    nestedObj["Nested objects\\nStill mutable"]
    strictCheck{"Strict mode?"}
    silentFail["Silent failure\\nno error"]
    typeErr["TypeError thrown"]
    deepFreeze["deepFreeze helper\\nRecursive freeze"]
    fullyFrozen["All levels\\nImmutable"]

    freeze --> shallowFrozen
    freeze --> nestedObj
    shallowFrozen --> strictCheck

      heading: `## Offline UPI Transactions Architecture`,
      content: `
### Overview

India's UPI payment system extends to offline scenarios (no network connectivity) using a Trusted Execution Environment (TEE) — a hardware-isolated secure enclave on the device. The payer pre-provisions a signed spending limit in the TEE. When offline, the TEE signs a payment token locally, validates that the payment doesn't exceed the pre-approved balance, and stores the signed token. When network is restored, the signed token is submitted to the NPCI server for settlement. This ensures security via cryptographic signing even without a live connection.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant U as Payer Device
    participant TEE as Secure Element TEE
    participant NPCI as NPCI Server
    participant Bank as Payer Bank

    Note over U,NPCI: Online Phase (pre-provisioning)
    U->>NPCI: Request offline spending limit
    NPCI->>Bank: Verify balance & lock funds
    Bank-->>NPCI: Funds reserved
    NPCI-->>TEE: Provision signed spending credential

    Note over U,TEE: Offline Phase (no network)
    U->>TEE: Initiate payment (amount, payee VPA)
    TEE->>TEE: Verify: amount <= remaining limit
    TEE->>TEE: Sign payment token with device key
    TEE-->>U: Signed payment token

    Note over U,NPCI: Sync Phase (network restored)
    U->>NPCI: Submit signed payment token
    NPCI->>NPCI: Verify cryptographic signature
    NPCI->>Bank: Deduct amount, settle to payee`
    }

      heading: `## Optimistic vs Pessimistic Locking`,
      content: `
### Overview

When multiple users or processes attempt to modify the same database record concurrently, you need a strategy to maintain data consistency. Optimistic Locking assumes conflicts are rare — it lets all readers proceed freely and only checks for conflicts at commit time using a version number. Pessimistic Locking assumes conflicts are likely — it locks the record immediately when a transaction begins, blocking all other writers until the lock is released. The right choice depends on the read/write ratio and conflict probability of your workload.

### Architecture Diagrams

**Optimistic Locking Flow:**
\`\`\`mermaid
sequenceDiagram
    participant User1
    participant User2
    participant DB

    User1->>DB: READ row (version=5)
    User2->>DB: READ row (version=5)
    User1->>DB: UPDATE WHERE version=5 → version=6 ✅
    User2->>DB: UPDATE WHERE version=5 → REJECTED (version now 6) ❌
    User2->>User2: Retry with fresh read
\`\`\`

**Pessimistic Locking Flow:**
\`\`\`mermaid
sequenceDiagram
    participant User1
    participant User2
    participant DB

    User1->>DB: SELECT ... FOR UPDATE (acquires lock)
    User2->>DB: SELECT ... FOR UPDATE (BLOCKED — waiting)`
    }

### Overview

Concurrency control determines how multiple transactions handle simultaneous access to the same record. Pessimistic locking prevents conflicts by blocking other accessors upfront; optimistic locking detects conflicts at commit time and retries. The correct choice depends on the contention level: high-contention systems favor pessimistic, read-heavy systems favor optimistic.

### Architecture Diagram

\`\`\`mermaid
stateDiagram-v2
    [*] --> ReadRecord
    ReadRecord --> PessimisticPath: High Contention
    ReadRecord --> OptimisticPath: Low Contention

    state PessimisticPath {
        acquireLock: Acquire Row Lock
        process: Process & Modify
        releaseLock: Release Lock
        acquireLock --> process --> releaseLock
    }

    state OptimisticPath {
        readVersion: Read + Store Version
        process2: Process Locally
        compareAndSwap: Compare Version at Commit
        retry: Retry on Conflict
        readVersion --> process2 --> compareAndSwap
        compareAndSwap --> retry: Version Mismatch
        compareAndSwap --> [*]: Version Match
    }
\`\`\``

### Overview

OTP (One-Time Password) authentication requires a stateful verification step that is fast, time-bounded, and brute-force protected. Redis is the ideal backing store because it natively supports TTL (expiration) on keys, atomic increment operations for retry counting, and sub-millisecond lookup performance. The flow must implement three critical security guardrails: expiry, attempt limiting, and account lockout.

    Validate -->|"NO"| Wrong["Increment Retry Counter"]
    Wrong --> CheckLimit{"Retry Count\\n> Limit?"}
    CheckLimit -->|"YES"| Lock["Lock Account /\\nBlock Requests for X Mins"]
    CheckLimit -->|"NO"| RetryErr["Return Error:\\n'Incorrect OTP. Try Again.'"]
    Validate -->|"YES"| Success["Delete OTP Key from Redis"]
    Success --> Grant["Generate JWT Access Token\\n/ Grant Entry"]

      heading: `## OTP System Design Mechanics`,
      content: `
**Video:** *Interview Question: An OTP is valid for 30 seconds. Where is it stored and how is it validated?*
**Creator:** nishasingla05

### Approach 1: TOTP (Time-Based OTP)

The server **does not store the OTP**.

\`\`\`
Mechanism:
1. Server and client share a secret key (one-time setup)
2. Both compute: TOTP = HMAC-SHA1(secret, floor(time / 30))
3. Server computes its own TOTP and compares to user-submitted OTP
4. Valid window: ±1 time step (90-second window to handle clock skew)
\`\`\`

### Approach 2: Database OTP (SMS/Email OTP)

\`\`\`
On OTP Generation:
  OTP = random 6-digit number
  Redis: SET otp:{user_id} {OTP} EX 30   ← stored with 30-sec TTL

On OTP Validation:
  GET otp:{user_id} from Redis
  IF match → valid; DEL otp:{user_id}     ← delete after use (prevent replay)
  IF not found → expired (TTL elapsed)
\`\`\`

### Architecture Diagram`

### Overview

The CAP Theorem states that during a network Partition, a distributed system must choose between Consistency and Availability. The PACELC Theorem extends CAP by asking: even when there is no partition (Else), what is the trade-off between Latency and Consistency? PACELC provides a more realistic model for classifying modern distributed databases because normal operation (no partition) is the common case. Every database sits somewhere on the PACELC spectrum, and system design answers should reference this framework.

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    start["Distributed System State"]
    partitionQ{"Network\\nPartition?"}

    subgraph partitionCase["Partition Case (PAC)"]
        chooseA["Choose Availability\\n(serve stale data)"]
        chooseC["Choose Consistency\\n(reject requests)"]
    end

    subgraph elseCase["Normal Case (ELC)"]
        chooseL["Choose Low Latency\\n(eventual consistency)"]
        chooseC2["Choose Consistency\\n(higher latency)"]
    end

    start --> partitionQ
    partitionQ -->|Yes| partitionCase
    partitionQ -->|No| elseCase

### Overview

The PACELC theorem extends the CAP theorem to address latency trade-offs in **normal operation** (no partition). CAP only describes behavior during a network partition; PACELC adds that even when the system is healthy, you must choose between **Latency (L)** and **Consistency (C)**. This makes PACELC a more complete framework for selecting distributed databases.

**Source:** Facebook Reel by Packetory

### The Acronym

\`\`\`
P  →  A/C    :   During a Partition, choose Availability or Consistency
E  →  L/C    :   Else (normal operation), choose Latency or Consistency

      heading: `## Poison Pill Messages`,
      content: `
### Overview

A Poison Pill Message is a message in a queue that causes the consumer (worker) to fail or crash every time it attempts to process the message. Because most messaging systems automatically re-queue failed messages for retry, the worker enters an infinite crash loop — consuming resources and blocking other healthy messages. The canonical solution is a **Dead Letter Queue (DLQ)**: after N failed attempts, the system routes the problematic message to a separate queue for human inspection or automated remediation, allowing the rest of the queue to drain normally.

### Architecture Diagram

\`\`\`mermaid
flowchart TD
    app["Application\\n(Producer)"]
    queue["Message Queue"]
    worker["Worker\\n(Consumer)"]
    poisonPill["Poison Pill Message\\n(malformed / unprocessable)"]
    retry["Retry Logic\\n(attempt 1, 2, 3...)"]
    dlq["Dead Letter Queue\\n(DLQ)"]
    healthyMsg["Healthy Messages\\n(continue processing)"]
    alert["Alert / Manual Review"]

    app -->|publishes| queue
    queue -->|delivers| worker
    worker -->|fails on| poisonPill
    poisonPill --> retry
    retry -->|max retries exceeded| dlq
    dlq --> alert
    queue --> healthyMsg
    healthyMsg --> worker

      content: `
### Overview

Polling (client repeatedly asks "any updates?") and WebSockets (server pushes updates to client) represent the two fundamental paradigms for data freshness. The key distinction: who drives the communication — the client (polling) or the server (WebSockets).

### Architecture Comparison

\`\`\`mermaid
flowchart LR
    subgraph Polling ["Polling Architecture"]
        Client_P["Client"]
        Server_P["Server"]
        Client_P -->|"Request every 5s: any update?"| Server_P
        Server_P -->|"Response: no change / new data"| Client_P
    end

    subgraph WS ["WebSocket Architecture"]

      heading: `## Polling vs. Long Polling`,
      content: `
### Overview

Polling (short polling) and long polling are HTTP-based techniques for a client to retrieve near-real-time updates from a server. In short polling, the client repeatedly sends requests at fixed intervals, receiving an immediate response regardless of whether new data exists. Long polling improves efficiency by holding the server connection open until new data is available or a timeout occurs, then immediately re-requesting. Both are legacy patterns superseded by WebSockets and SSE, but remain relevant for systems constrained to standard HTTP and for understanding the evolution of real-time web architecture.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant C as Client
    participant S as Server

    Note over C,S: Short Polling (every 5s)
    C->>S: GET /updates
    S-->>C: 200 OK (empty)
    C->>S: GET /updates (5s later)
    S-->>C: 200 OK (empty)
    C->>S: GET /updates (5s later)
    S-->>C: 200 OK (new data!)

    Note over C,S: Long Polling
    C->>S: GET /updates
    Note right of S: Server holds connection open...
    Note right of S: ...until data arrives
    S-->>C: 200 OK (new data!)
    C->>S: GET /updates (immediately)
\`\`\`

\`\`\`mermaid
flowchart TD`

      heading: `## Ports vs Sockets`,
      content: `
**Video:** *Port Number vs Socket: Interview Explanation*

### Definitions

| Concept | Definition |
|---|---|
| **Port** | A logical number (0–65535) that identifies a specific process/service on a host. It's part of the address — not a connection. |
| **Socket** | A combination of \`IP Address + Port Number + Protocol\`. It represents one endpoint of an active network connection. |
| **Socket Pair** | \`(Client IP:Port, Server IP:Port)\` — uniquely identifies a full TCP connection |

### Key Distinction

A port is **passive** (a label on a door). A socket is **active** (an open channel through that door).

\`\`\`
Server listening on port 443 (HTTPS)

Client A: 192.168.1.10:54321 → 10.0.0.1:443  (Socket Pair 1)
Client B: 192.168.1.11:54322 → 10.0.0.1:443  (Socket Pair 2)
\`\`\`

Both clients use **port 443**, but each has a unique **socket pair** — so they don't interfere.

### Interview Q&A

| Question | Answer |
|---|---|
| Can two processes share the same port? | Yes, with \`SO_REUSEPORT\` socket option — allows multiple processes to bind the same port (used by Nginx worker processes for load distribution) |
| What is a well-known port range? | 0–1023; reserved for system services (80=HTTP, 443=HTTPS, 22=SSH, 5432=Postgres) |`

      content: `
### Overview

A naive file upload routes data through your backend: \`Client → Backend → S3\`. For large files, this doubles the bandwidth and crushes your load balancers. Pre-signed URLs solve this by giving the client a temporary, signed permission slip to upload directly to S3, removing your backend from the data path entirely.

### Architecture Diagram

\`\`\`mermaid
sequenceDiagram
    participant Client
    participant Backend as Backend API
    participant S3 as AWS S3

    Client->>Backend: POST /get-upload-url (filename, size)
    Backend->>S3: GeneratePresignedUrl(key, expires=600)
    S3-->>Backend: Signed URL (valid 10 min)
    Backend-->>Client: { uploadUrl, fileKey }

    Client->>S3: PUT uploadUrl (file bytes directly)
    S3-->>Client: 200 OK
    Client->>Backend: POST /confirm-upload { fileKey }
    Backend->>Backend: Save fileKey to DB
\`\`\`

### The 20GB Bottleneck Problem

\`\`\`
Naive:    Client → Backend (10GB in) → S3 (10GB out) = 20GB bandwidth per upload
Presigned: Client → S3 (10GB direct) = 10GB, Backend handles 0 bytes of file data
\`\`\``
